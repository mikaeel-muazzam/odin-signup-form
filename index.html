<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form | The Odin Project</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="content">
        <div class="sidebar">
            <div class="odin-banner">
                <img alt="odin-logo" src="./assets/odin-logo.png">
                <span>ODIN</span>
            </div>
            <div class="image-credit">Photo from the <a href="https://pdimagearchive.org/images/6b7e8207-d244-41d0-83dd-645b1f639078">Public Domain Image Archive</a></div>
        </div>
        <div class="main">
            <div class="description">
                <p>This is not a real online service! You know you need something like this in your life to help you realise your deepest dreams.
                    Sign up <em>now</em> to get started.
                </p>
                <p>You <em>know</em> you want to.</p>
            </div>
            <div class="form-container">
                <h2>Let's do this!</h2>
                <form action="" method="post" id="signup-form">
                    <ul>
                        <li>
                            <label for="first-name">FIRST NAME</label>
                            <input id="first-name" name="first-name">
                        </li>
                        <li>
                            <label for="last-name">LAST NAME</label>
                            <input id="last-name" name="last-name">
                        </li>
                        <li>
                            <label for="email">EMAIL</label>
                            <input id="email" type="email" name="email">
                        </li>
                        <li>
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="tel" id="phone-number" name="phone-number">
                        </li>
                        <li>
                            <label for="pass">PASSWORD</label>
                            <input type="password" id="pass" name="password">
                        </li>
                        <li>
                            <label for="pass-confirm">CONFIRM PASSWORD</label>
                            <input type="password" id="pass-confirm" name="password-confirm">
                        </li>
                    </ul>
                </form>
            </div>
            <div class="footer">
                <button class="submit">Create Account</button>
                <p>Already have an account? <a href=".">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
